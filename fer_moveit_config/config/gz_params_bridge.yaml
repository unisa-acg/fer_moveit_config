# gazebo-ros bridge configuration to bridge topics between ROS2 and Gazebo
# This is needed to make sure the simulator clock is used by the ROS2 ecosystem
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
