# MoveIt uses this configuration for controller management on real FER hardware

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - fer_arm_trajectory_controller
    - fer_gripper

  fer_arm_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7

  fer_gripper:
    type: GripperCommand
    joints:
      - fer_finger_joint1
    action_ns: gripper_action
    default: true
